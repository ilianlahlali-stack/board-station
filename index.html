<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="menu" class="screen">
    <header class="menu-head">
      <div class="logo"><span class="logo-die">⚄</span> Board Station</div>
      <p class="tagline">Ta table de jeux de société — au tour par tour, sur cet ordinateur.</p>
    </header>
    <div id="game-grid" class="game-grid"></div>
    <footer class="menu-foot">
      <button id="sound-toggle" class="chip-btn" type="button">🔊 Son activé</button>
      <span>Chaque partie utilise une graine aléatoire unique.</span>
    </footer>
  </section>

  <section id="game" class="screen hidden">
    <header class="hud">
      <button id="btn-back" class="hud-btn" type="button">← Menu</button>
      <div id="hud-title" class="hud-title"></div>
      <div class="hud-right">
        <span id="hud-seed" class="seed-badge" title="Graine de la partie"></span>
        <button id="btn-qr" class="hud-btn hidden" type="button">📱 QR</button>
        <button id="btn-rules" class="hud-btn" type="button">Règles</button>
        <button id="btn-restart" class="hud-btn" type="button">Nouvelle partie</button>
      </div>
    </header>
    <div class="table-frame">
      <div id="table" class="table"></div>
    </div>
  </section>
</div>
<div id="fx-layer"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/rng.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/cards.js"></script>
<script src="js/seats.js"></script>
<script src="js/net.js"></script>
<script src="js/games/dice421.js"></script>
<script src="js/games/president.js"></script>
<script src="js/games/chroma.js"></script>
<script src="js/app.js"></script>
</body>
</html>
